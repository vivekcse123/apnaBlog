@if (totalPages() > 1) {
  <nav class="pg-nav" aria-label="Pagination">
    <button class="pg-btn pg-btn--nav" [disabled]="currentPage()===1" (click)="goTo(currentPage()-1)" aria-label="Previous page">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    @for (p of pageNumbers(); track $index) {
      @if (p === '…') {
        <span class="pg-dots">&hellip;</span>
      } @else {
        <button class="pg-btn" [class.active]="p === currentPage()" [attr.aria-current]="p === currentPage() ? 'page' : null" (click)="goTo($any(p))">{{ p }}</button>
      }
    }
    <button class="pg-btn pg-btn--nav" [disabled]="currentPage()===totalPages()" (click)="goTo(currentPage()+1)" aria-label="Next page">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </nav>
}
